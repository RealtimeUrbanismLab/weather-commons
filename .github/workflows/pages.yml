name: pages
# Builds the site with scripts/build-pages.mjs. On main it deploys to GitHub Pages
# (https://<owner>.github.io/weather-commons/, so forks get their own copy).
# On a pull request it only checks that the site still builds.
on:
  push:
    branches: [main]
    paths: [sketches/**, guide/**, catalog/**, resources/**, site/**, scripts/build-pages.mjs, scripts/index-sketches.mjs, .github/workflows/pages.yml]
  pull_request:
    paths: [sketches/**, guide/**, catalog/**, resources/**, site/**, scripts/build-pages.mjs, scripts/index-sketches.mjs, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: node scripts/build-pages.mjs --base /${{ github.event.repository.name }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
